<style>
    .nav-transition {
        transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .nav-hidden {
        transform: translateY(-120%);
    }
    /* Transición de montaje de vistas del router */
    #app-content {
        transition: opacity 0.2s ease;
    }
    /* Compliance carousel */
    .compliance-track {
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .compliance-track::-webkit-scrollbar { display: none; }
    .compliance-card { scroll-snap-align: start; }
    /* Candlestick Animation Setup */
    @keyframes driftUp {
        0% { transform: translateY(100vh); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-100vh); opacity: 0; }
    }
    @keyframes driftDown {
        0% { transform: translateY(-100vh); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(100vh); opacity: 0; }
    }
    .candlestick {
        position: absolute;
        width: 12px;
        z-index: 0;
        border-radius: 2px;
    }
    .candlestick::before, .candlestick::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        background-color: inherit;
    }
    .candlestick::before { bottom: 100%; height: 20px; }
    .candlestick::after { top: 100%; height: 20px; }

    .candle-green { background-color: #25D366; animation: driftUp linear infinite; }
    .candle-red { background-color: #930007; animation: driftDown linear infinite; }
</style>
